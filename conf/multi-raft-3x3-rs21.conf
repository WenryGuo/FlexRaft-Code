# FlexRaft Multi-Raft 测试配置 - 3节点3组
# 每个节点创建3个Raft实例
# 使用 all_nodes_per_group 模式：每个group包含所有3个节点
#
# 配置说明：
#   - 第一行：N（物理节点总数）
#   - rs k=2 r=1 （RS(2,1) 编码参数）
#   - all_nodes_per_group （每个组包含所有节点）
#   - groups_per_node 3 （每节点3个Raft实例）
#   - 节点行：node_id  raft_addr  kv_addr  raft_log  kv_db
#
# 字段说明：
#   - raft_addr   : Raft RPC 通信地址 (IP:Port)，节点间共识协议通信
#   - kv_addr     : KV 服务 RPC 地址 (IP:Port)，客户端读写请求
#   - raft_log    : Raft 共识日志文件路径，持久化存储 log entries
#                  FlexRaft 会对此文件中的数据应用 LRC 纠删码编码
#   - kv_db       : RocksDB 数据库路径，存储已提交的 KV 状态机数据

3
rs  k=2  r=1
all_nodes_per_group
groups_per_node 3
0  127.0.0.1:50010  127.0.0.1:60010  /tmp/mr3rs_n0.log  /tmp/mr3rs_n0.db
1  127.0.0.1:50011  127.0.0.1:60011  /tmp/mr3rs_n1.log  /tmp/mr3rs_n1.db
2  127.0.0.1:50012  127.0.0.1:60012  /tmp/mr3rs_n2.log  /tmp/mr3rs_n2.db