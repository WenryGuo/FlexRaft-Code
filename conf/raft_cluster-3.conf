# FlexRaft Multi-Raft 示例配置文件
# 格式：第一行为集群规模 N，后续为物理节点配置
# LRC 参数根据集群规模自动计算：k=floor(N/2)+1, l=能被k整除的最大值, r=N-k-l
#
# 节点行格式：local_id  raft_addr  kv_addr  raft_log  kv_db
# （local_id 即物理节点 id，从 0 开始）
#
# 字段说明：
#   raft_addr   : Raft RPC 通信地址 (IP:Port)，用于节点间 Raft 协议消息交换
#   kv_addr     : KV 服务 RPC 地址 (IP:Port)，用于客户端读写请求
#   raft_log    : Raft 共识日志文件路径（持久化存储 Raft log entries）
#                 FlexRaft 会对 raft_log 中的日志数据应用 LRC 纠删码编码后存储
#   kv_db       : RocksDB 数据库路径，存储已提交的 KV 状态机数据
0 172.30.14.188:50001 172.30.14.188:50002 /tmp/raft_log0 /tmp/testdb0
1 172.30.14.42:50001 172.30.14.42:50002 /tmp/raft_log1 /tmp/testdb1
2 172.30.15.179:50001 172.30.15.179:50002 /tmp/raft_log2 /tmp/testdb2
